[project]
name = "mlops-lab-1"
version = "0.1.0"
description = "Food-11 data preparation, model training, and prediction API for the MLOps labs"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
	"fastapi>=0.141.1",
	"mlflow>=3.16.0",
	"pillow>=10.0",
	"python-multipart>=0.0.32",
	"scikit-learn>=1.9.1",
	"torch>=2.14.0",
	"torchvision>=0.29.0",
	"uvicorn>=0.53.0",
]

[project.scripts]
mlops-lab-1 = "food11.cli:main"

[dependency-groups]
dev = [
	"pytest>=8.0",
    "ruff>=0.11",
    "httpx>=0.28",
]

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[tool.uv.build-backend]
module-name = "food11"

[tool.ruff]
# Keep lint behavior reproducible instead of inheriting parent-directory config.
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
